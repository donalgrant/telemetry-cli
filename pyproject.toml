[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "telemetry-cli"
version = "1.0.0"
description = "Command-line tools for binary telemetry: decode, extract, measure and generate records"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David A. Imel" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.23"]
keywords = ["telemetry", "binary", "records", "decoding", "pcm", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "hypothesis>=6",
    "ruff>=0.5",
    "tomli>=2; python_version < '3.11'",
]

[project.scripts]
pick = "telemetry_cli.pick.cli:main"
recs = "telemetry_cli.recs.cli:main"
recl = "telemetry_cli.recl.cli:main"
tgen = "telemetry_cli.tgen.cli:main"

[project.urls]
Repository = "https://github.com/donalgrant/telemetry-cli"
Documentation = "https://github.com/donalgrant/telemetry-cli/tree/main/docs"
Changelog = "https://github.com/donalgrant/telemetry-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/donalgrant/telemetry-cli/issues"

[tool.hatch.build.targets.sdist]
exclude = [".github", "/.gitignore", "legacy", "build"]

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["oracle: compares against the legacy Perl tools live (needs perl)"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["SIM108"]  # if/else blocks are often clearer than long ternaries
